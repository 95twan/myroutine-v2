spring:
  application:
    name: myroutine
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

management:
  server:
    port: 8081

myroutine:
  business-zone: Asia/Seoul
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:}
    region: us-east-1
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: myroutine
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/myroutine}
    upload-url-ttl: 10m
    max-upload-bytes: 5242880
  order:
    payment-ttl: 15m
  toss:
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY:}
    connect-timeout: 3s
    read-timeout: 10s
  settlement:
    fee-rate-bp: 500

logging.pattern.level: "%5p [%X{traceId:-}]"
