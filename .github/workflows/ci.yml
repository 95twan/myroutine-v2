name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    # CD는 이 push 실행의 완료로 시작하므로, 문서만 바뀐 커밋은 배포까지 건너뛴다.
    # pull_request에는 걸지 않는다: 경로 필터로 건너뛴 필수 체크(build)는 보고되지 않아 PR 머지가 막힌다.
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 문서만 바뀐 PR은 빌드 단계만 건너뛰고 build 체크는 성공으로 보고해 머지 조건을 채운다.
      - name: Detect code changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.code == 'true'
      - run: ./gradlew build
        if: steps.changes.outputs.code == 'true'
