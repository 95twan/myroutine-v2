name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    # CD는 이 push 실행의 완료로 시작하므로, 문서만 바뀐 커밋은 배포까지 건너뛴다.
    # pull_request에는 걸지 않는다: 경로 필터로 건너뛴 필수 체크(build)는 보고되지 않아 PR 머지가 막힌다.
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
