name: Notify

on:
  workflow_run:
    workflows: [CI, CD]
    types: [completed]

jobs:
  telegram:
    # push의 CI 성공은 곧 CD가 이어지므로 건너뛴다. 실패, CD 성공, PR의 CI 성공을 알린다.
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      (github.event.workflow_run.name == 'CD' && github.event.workflow_run.conclusion == 'success') ||
      (github.event.workflow_run.name == 'CI' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          TEXT="$ICON $WORKFLOW $CONCLUSION
          branch: $BRANCH
          by: $ACTOR
          $(echo "$COMMIT_MSG" | head -n1)
          $RUN_URL"
          curl -sS --fail -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
