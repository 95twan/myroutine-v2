name: myroutine

services:
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: my_routine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: chainguard/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API 포트
      - "127.0.0.1:9001:9001"   # 웹 콘솔 포트
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"

  redis:
    image: redis:7.4.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  minio_data:
