global:
  scrape_interval: 15s
scrape_configs:
  - job_name: myroutine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]
  - job_name: cadvisor
    static_configs:
      - targets: [ "cadvisor:8080" ]
